name: Validate Docker, profiles and bookings

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary CI configuration
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          keys = ('MYSQL_PASSWORD', 'MYSQL_ROOT_PASSWORD', 'SESSION_SECRET', 'ADMIN_PASSWORD')
          Path('.env').write_text(''.join(f'{key}={secrets.token_hex(32)}\n' for key in keys) + 'APP_ORIGIN=http://127.0.0.1:3000\nADMIN_USERNAME=ci-admin\nADMIN_NAME=CI Admin\nALLOW_INTEGRATION_TESTS=1\n')
          Path('.env').chmod(0o600)
          PY
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start application with MySQL
        run: docker compose up --detach --build --wait --wait-timeout 180
      - name: Verify page and migrated schema
        run: |
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/api/health
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/demo/agenda
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/login-conductor
          curl --fail --silent --output /tmp/home.html http://127.0.0.1:3000
          grep -q 'Driver Connect' /tmp/home.html
          curl --fail --silent --output /tmp/profile.html http://127.0.0.1:3000/conductor/demo
          grep -q 'Daniel' /tmp/profile.html
          curl --fail --silent --output /tmp/contact.vcf http://127.0.0.1:3000/conductor/demo/contacto
          grep -q 'BEGIN:VCARD' /tmp/contact.vcf
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/images/demo-suv.png
          curl --fail --silent --output /dev/null 'http://127.0.0.1:3000/_next/image?url=%2Fimages%2Fdemo-suv.png&w=640&q=75'
          docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -e "SELECT COUNT(*) FROM Driver; SELECT COUNT(*) FROM Vehicle; SELECT COUNT(*) FROM Service; SELECT COUNT(*) FROM AdminUser; SELECT COUNT(*) FROM DriverUser;"'
      - name: Create disposable administrator
        run: docker compose --profile tools run --rm -T admin-create
      - name: Verify administration, bookings and private calendars against MySQL
        run: docker compose --profile test run --rm -T test
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100 app migrate db
      - name: Stop CI containers and remove disposable test data
        if: always()
        run: docker compose down --volumes
