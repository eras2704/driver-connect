name: driver-connect

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: driver_connect
      MYSQL_USER: driver_connect
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: mysql://driver_connect:${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}@db:3306/driver_connect
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: mysql://driver_connect:${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}@db:3306/driver_connect
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      CALENDAR_TOKEN_KEY: ${CALENDAR_TOKEN_KEY:-}
      CALENDAR_GOOGLE_CLIENT_ID: ${CALENDAR_GOOGLE_CLIENT_ID:-}
      CALENDAR_GOOGLE_CLIENT_SECRET: ${CALENDAR_GOOGLE_CLIENT_SECRET:-}
      CALENDAR_MICROSOFT_CLIENT_ID: ${CALENDAR_MICROSOFT_CLIENT_ID:-}
      CALENDAR_MICROSOFT_CLIENT_SECRET: ${CALENDAR_MICROSOFT_CLIENT_SECRET:-}
    volumes:
      - driver_uploads:/app/data/uploads
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin-create:
    profiles: [tools]
    build:
      context: .
      target: migrator
    command: [pnpm, admin:create]
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL: mysql://driver_connect:${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}@db:3306/driver_connect
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  test:
    profiles: [test]
    build:
      context: .
      target: migrator
    command: [pnpm, test:integration]
    environment:
      DATABASE_URL: mysql://driver_connect:${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}@db:3306/driver_connect
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3000}
      CALENDAR_TOKEN_KEY: ${CALENDAR_TOKEN_KEY:-}
      CALENDAR_GOOGLE_CLIENT_ID: ${CALENDAR_GOOGLE_CLIENT_ID:-}
      CALENDAR_GOOGLE_CLIENT_SECRET: ${CALENDAR_GOOGLE_CLIENT_SECRET:-}
      CALENDAR_MICROSOFT_CLIENT_ID: ${CALENDAR_MICROSOFT_CLIENT_ID:-}
      CALENDAR_MICROSOFT_CLIENT_SECRET: ${CALENDAR_MICROSOFT_CLIENT_SECRET:-}
      TEST_BASE_URL: http://app:3000
      ALLOW_INTEGRATION_TESTS: ${ALLOW_INTEGRATION_TESTS:-0}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  driver_uploads:
